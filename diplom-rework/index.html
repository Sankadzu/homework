<!DOCTYPE html>
<html class="page" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./icons/star-favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./css/index.css">
  <title>SHOP.CO</title>
</head>
<body class="page__body">
  <header class="header">
    <div class="header__container container">
      <div class="header__menu-logo">
        <button class="header__burger-button">
          <svg 
          width="19" 
          height="15">
            <use href="./icons/sprite.svg#burger"></use>
          </svg>
        </button>
        <a href="#" class="header__logo-text">
        SHOP.CO
      </a>
    </div>

      <nav class="header__menu">
        <ul class="header__menu-list">
          <li class="header__menu-item header__dropdown">
            <a class="header__menu-link header__link-drop" href="#">
              Магазин
              <svg class="header__menu-button" width="12" height="7">
              <use  href="./icons/sprite.svg#arrow-down"></use>
              </svg>
            </a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#">
              Скидки
            </a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#">
              Новые поступления
            </a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#">
              Бренды
            </a>
          </li>
        </ul>
      </nav>
      <div class="header__container-search">
          <label class="header__search-label">
            <button class="header__search-button">
              <svg  width="24" height="24">
              <use  href="./icons/sprite.svg#search"></use>
              </svg>
            </button>
            <input
            class="header__search-input" type="text" placeholder="Искать товары..."  name="search">
          </label>
      </div>
        <div class="header__actions">
          <button class="header__actions-button">
            <svg width="24" height="24" >
            <use  href="./icons/sprite.svg#cart"></use>
            </svg>
          </button>
          <button class="header__actions-button">
            <svg width="24" height="24" >
            <use href="./icons/sprite.svg#profile"></use>
            </svg>
          </button>    
      </div>
    </div>
  </header>
</body>
</html>
