<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./CSS/normalize.css">
  <link rel="stylesheet" href="./CSS/style.css">
  <title>form</title>
</head>
<body>
  <form class="form">
    <fieldset class="fieldset-1">
      <legend class="title-1">Ваши личные данные</legend>
      <label class="label">
        Ваше имя
        <input type="text" name="name" placeholder="Имя" required class="input"> 
      </label>
      <label class="label">
        Ваш возраст
        <input type="number" name="age" inputmode="numeric" placeholder="Возраст" required class="input">
      </label>
      <label class="label">
        Ваш номер телефона
        <input type="tel" name="tel" inputmode="tel" placeholder="Номер телефона" required class="input">
      </label>
      <label class="label">
        Ваша почта
        <input type="email" name="email" inputmode="email" placeholder="Почта" required class="input">
      </label>
    </fieldset>
      <fieldset class="fieldset-2">
      <label class="label">
        Сообщение
        <textarea class="textarea" cols="27" name="message" placeholder="Ваше сообщение"></textarea>
      </label>
      <label class="label-checkbox">
        <input type="checkbox" class="checkbox" value="first">
        <span>Я принимаю правила</span>
      </label>
    </fieldset>
      <button type="submit" class="button">Отправить</button>
  </form>
</body>
</html>
